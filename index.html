<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locomotive of Fail — YARG Songs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--char:#161616;--fg:#ECECEC;--mut:#B5B5B5;--red:#B3001B;--red2:#E0102F;--redt:#FF4D5E;--steel:#4A4D52;--steel2:#6B6F75}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
background:
repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 2px),
radial-gradient(ellipse 80% 50% at 50% 0%,rgba(255,255,255,.06),transparent 70%),
radial-gradient(circle at 20% 80%,rgba(179,0,27,.06),transparent 40%),
linear-gradient(180deg,#141414,#0A0A0A 60%);background-attachment:fixed}
header{padding:16px 16px 14px;position:sticky;top:0;z-index:2;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 2px),linear-gradient(180deg,#232323,#121212);
border-bottom:2px solid var(--steel);box-shadow:0 1px 0 #000,0 6px 18px rgba(0,0,0,.7)}
h1{margin:0 0 10px;font-family:"Metal Mania","UnifrakturCook",Impact,serif;font-weight:400;font-size:2.1em;letter-spacing:.03em;line-height:1.1;
background:linear-gradient(180deg,#FFFFFF 0%,#D9D9D9 30%,#8A8A8A 50%,#E6E6E6 62%,#9A9A9A 85%,#F5F5F5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 6px rgba(179,0,27,.35))}
h1 span{color:inherit}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{background:#1B1B1B;color:var(--fg);border:1px solid var(--steel);border-radius:3px;padding:9px 10px;font:inherit;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
select option{background:#1B1B1B}
input{flex:1 1 240px}input::placeholder{color:#9A9A9A}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red2);outline-offset:1px;border-color:var(--red2);box-shadow:0 0 0 3px rgba(224,16,47,.25)}
#count{color:var(--mut);font-weight:700;letter-spacing:.03em}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;text-align:left;cursor:pointer;color:var(--mut);padding:10px 8px;border-bottom:2px solid var(--steel);user-select:none;white-space:nowrap;text-transform:uppercase;font-size:.78em;letter-spacing:.1em;background:linear-gradient(180deg,#1E1E1E,#141414)}
th:hover{color:var(--fg)}
th.s{color:var(--redt);border-bottom-color:var(--red2)}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
td{padding:7px 8px;border-bottom:1px solid #2A2B2E;vertical-align:top}
td.sc{background:rgba(179,0,27,.10)}
tbody tr:nth-child(even) td{background-color:rgba(255,255,255,.03)}
tbody tr:hover td{background-color:rgba(255,255,255,.07)}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--red2)}
main{padding:0 16px 16px}.pg{display:flex;gap:8px;justify-content:center;align-items:center;padding:14px;color:var(--mut)}
button{cursor:pointer;background:linear-gradient(180deg,#2A2A2A,#171717)}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){border-color:var(--red2)}
.pill{display:inline-block;padding:1px 8px;border-radius:2px;font-size:.8em;font-weight:700;white-space:nowrap;border:1px solid;text-transform:uppercase;letter-spacing:.04em}
.pill.s{color:#FFFFFF;background:var(--red);border-color:#7A0012}
.pill.g{color:#FF8A95;background:rgba(179,0,27,.12);border-color:var(--red)}
@media(max-width:700px){thead{display:none}table,tbody,tr,td{display:block}h1{font-size:1.7em}
tbody tr{margin:8px 0;padding:8px;border:1px solid var(--steel);border-radius:3px;background:linear-gradient(180deg,#181818,#101010)}
td{border:0;padding:2px 4px;background:none!important}td:before{content:attr(data-l)": ";color:var(--mut);font-size:.78em;text-transform:uppercase;letter-spacing:.06em}
.sortm{display:inline-block}}
@media(min-width:701px){.sortm{display:none}}
</style></head><body>
<header><h1>Locomotive of Fail — <span>YARG</span> Songs</h1><div class="ctl">
<input id="q" type="search" placeholder="Search artist, title, album, genre, charter…" autofocus>
<select id="fs"><option value="">All sources</option></select><select id="fg"><option value="">All genres</option></select>
<select id="sm" class="sortm"></select><span id="count">Loading…</span></div></header>
<main><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table>
<div class="pg"><button id="pv">‹ Prev</button><span id="pi"></span><button id="nx">Next ›</button>
<select id="ps"><option>100</option><option selected>250</option><option>500</option><option>1000</option></select></div></main>
<script>
const C=[["artist","Artist"],["title","Title"],["album","Album"],["year","Year"],["genre","Genre"],["charter","Charter"],["source_folder","Source"]];
let D=[],F=[],sk="artist",sd=1,page=0,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=new Intl.Collator(undefined,{sensitivity:"base",numeric:true});
$("hd").innerHTML=C.map(([k,l])=>`<th data-k="${k}">${l}</th>`).join("");
$("sm").innerHTML=C.flatMap(([k,l])=>[`<option value="${k}|1">Sort: ${l} ↑</option>`,`<option value="${k}|-1">Sort: ${l} ↓</option>`]).join("");
$("hd").onclick=e=>{const k=e.target.dataset.k;if(!k)return;sd=sk===k?-sd:1;sk=k;run()};
$("sm").onchange=e=>{const[k,d]=e.target.value.split("|");sk=k;sd=+d;run()};
function run(){const q=$("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean),s=$("fs").value,g=$("fg").value;
F=D.filter(r=>(!s||r.source_folder===s)&&(!g||r.genre===g)&&q.every(t=>r._h.includes(t)));
F.sort((a,b)=>sk==="year"?((+a.year||9e9)-(+b.year||9e9))*sd||col.compare(a.artist,b.artist):col.compare(a[sk]||"\uffff",b[sk]||"\uffff")*sd);
document.querySelectorAll("th").forEach(t=>{t.className=t.dataset.k===sk?"s"+(sd<0?" d":""):""});$("sm").value=sk+"|"+sd;page=0;draw()}
function draw(){const n=+$("ps").value,pages=Math.max(1,Math.ceil(F.length/n));page=Math.min(page,pages-1);
$("tb").innerHTML=F.slice(page*n,page*n+n).map(r=>"<tr>"+C.map(([k,l])=>{const v=esc(r[k]||""),p=k==="source_folder"?"s":k==="genre"?"g":"";return `<td data-l="${l}"${k===sk?' class="sc"':""}>${p&&v?`<span class="pill ${p}">${v}</span>`:v}</td>`}).join("")+"</tr>").join("");
$("count").textContent=`${F.length.toLocaleString()} of ${D.length.toLocaleString()} songs`;$("pi").textContent=`Page ${page+1} / ${pages}`;
$("pv").disabled=page===0;$("nx").disabled=page>=pages-1}
$("pv").onclick=()=>{page--;draw();scrollTo(0,0)};$("nx").onclick=()=>{page++;draw();scrollTo(0,0)};$("ps").onchange=draw;
let t;$("q").oninput=()=>{clearTimeout(t);t=setTimeout(run,120)};$("fs").onchange=run;$("fg").onchange=run;
fetch("songs.json").then(r=>r.json()).then(j=>{D=j;D.forEach(r=>r._h=C.map(([k])=>r[k]||"").join(" ").toLowerCase());
const opt=(id,k)=>{const m={};D.forEach(r=>{if(r[k])m[r[k]]=(m[r[k]]||0)+1});$(id).innerHTML+=Object.keys(m).sort(col.compare).map(v=>`<option value="${esc(v)}">${esc(v)} (${m[v]})</option>`).join("")};
opt("fs","source_folder");opt("fg","genre");run()});
</script></body></html>
