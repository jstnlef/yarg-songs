<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locomotives of Fail — YARG Songs</title><style>
:root{--bg:#07050D;--fg:#F4F1FA;--mut:#B9B2CC;--pink:#FF2E88;--cyan:#22D3EE;--vio:#A855F7;--vio2:#C49BFF;--row:rgba(255,255,255,.035);--line:rgba(168,85,247,.22)}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;
background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(124,58,237,.38),transparent 70%),radial-gradient(ellipse 45% 35% at 10% 0%,rgba(37,99,235,.25),transparent 70%),radial-gradient(ellipse 45% 35% at 90% 0%,rgba(255,46,136,.16),transparent 70%),var(--bg);background-attachment:fixed}
header{padding:18px 16px 14px;position:sticky;top:0;z-index:2;background:rgba(7,5,13,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(34,211,238,.25),0 8px 30px -12px rgba(168,85,247,.5)}
h1{margin:0 0 12px;font-size:1.7em;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,var(--pink),var(--vio) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,46,136,.45)) drop-shadow(0 0 22px rgba(168,85,247,.35))}
h1 span{color:inherit}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{background:rgba(255,255,255,.05);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;transition:box-shadow .15s,border-color .15s}
select option{background:#140f1f}
input{flex:1 1 240px}input::placeholder{color:var(--mut)}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 14px rgba(34,211,238,.55)}
#count{color:var(--cyan);font-weight:700;text-shadow:0 0 10px rgba(34,211,238,.6)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;text-align:left;cursor:pointer;color:var(--vio2);padding:10px 8px;border-bottom:1px solid var(--line);user-select:none;white-space:nowrap;text-transform:uppercase;font-size:.78em;letter-spacing:.08em}
th:hover{color:var(--fg)}
th.s{color:var(--pink);text-shadow:0 0 10px rgba(255,46,136,.7);border-bottom:2px solid var(--pink)}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
td.sc{background:rgba(255,46,136,.06)}
tbody tr:nth-child(even) td{background-color:var(--row)}
tbody tr{transition:box-shadow .15s,background .15s}
tbody tr:hover td{background-color:rgba(168,85,247,.12)}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--cyan),0 0 18px -4px rgba(168,85,247,.6)}
main{padding:0 16px 16px}.pg{display:flex;gap:8px;justify-content:center;align-items:center;padding:14px;color:var(--mut)}
button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:hover:not(:disabled){border-color:var(--pink);box-shadow:0 0 12px rgba(255,46,136,.5)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.82em;font-weight:600;white-space:nowrap;border:1px solid}
.pill.s{color:#7EE8F7;background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.45);box-shadow:0 0 8px -2px rgba(34,211,238,.5)}
.pill.g{color:#FF8DBE;background:rgba(255,46,136,.1);border-color:rgba(255,46,136,.45);box-shadow:0 0 8px -2px rgba(255,46,136,.5)}
@media(max-width:700px){thead{display:none}table,tbody,tr,td{display:block}
tbody tr{margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
td{border:0;padding:2px 4px;background:none!important}td:before{content:attr(data-l)": ";color:var(--vio2);font-size:.8em;text-transform:uppercase;letter-spacing:.05em}
.sortm{display:inline-block}}
@media(min-width:701px){.sortm{display:none}}
</style></head><body>
<header><h1>Locomotives of Fail — <span>YARG</span> Songs</h1><div class="ctl">
<input id="q" type="search" placeholder="Search artist, title, album, genre, charter…" autofocus>
<select id="fs"><option value="">All sources</option></select><select id="fg"><option value="">All genres</option></select>
<select id="sm" class="sortm"></select><span id="count">Loading…</span></div></header>
<main><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table>
<div class="pg"><button id="pv">‹ Prev</button><span id="pi"></span><button id="nx">Next ›</button>
<select id="ps"><option>100</option><option selected>250</option><option>500</option><option>1000</option></select></div></main>
<script>
const C=[["artist","Artist"],["title","Title"],["album","Album"],["year","Year"],["genre","Genre"],["charter","Charter"],["source_folder","Source"]];
let D=[],F=[],sk="artist",sd=1,page=0,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=new Intl.Collator(undefined,{sensitivity:"base",numeric:true});
$("hd").innerHTML=C.map(([k,l])=>`<th data-k="${k}">${l}</th>`).join("");
$("sm").innerHTML=C.flatMap(([k,l])=>[`<option value="${k}|1">Sort: ${l} ↑</option>`,`<option value="${k}|-1">Sort: ${l} ↓</option>`]).join("");
$("hd").onclick=e=>{const k=e.target.dataset.k;if(!k)return;sd=sk===k?-sd:1;sk=k;run()};
$("sm").onchange=e=>{const[k,d]=e.target.value.split("|");sk=k;sd=+d;run()};
function run(){const q=$("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean),s=$("fs").value,g=$("fg").value;
F=D.filter(r=>(!s||r.source_folder===s)&&(!g||r.genre===g)&&q.every(t=>r._h.includes(t)));
F.sort((a,b)=>sk==="year"?((+a.year||9e9)-(+b.year||9e9))*sd||col.compare(a.artist,b.artist):col.compare(a[sk]||"\uffff",b[sk]||"\uffff")*sd);
document.querySelectorAll("th").forEach(t=>{t.className=t.dataset.k===sk?"s"+(sd<0?" d":""):""});$("sm").value=sk+"|"+sd;page=0;draw()}
function draw(){const n=+$("ps").value,pages=Math.max(1,Math.ceil(F.length/n));page=Math.min(page,pages-1);
$("tb").innerHTML=F.slice(page*n,page*n+n).map(r=>"<tr>"+C.map(([k,l])=>{const v=esc(r[k]||""),p=k==="source_folder"?"s":k==="genre"?"g":"";return `<td data-l="${l}"${k===sk?' class="sc"':""}>${p&&v?`<span class="pill ${p}">${v}</span>`:v}</td>`}).join("")+"</tr>").join("");
$("count").textContent=`${F.length.toLocaleString()} of ${D.length.toLocaleString()} songs`;$("pi").textContent=`Page ${page+1} / ${pages}`;
$("pv").disabled=page===0;$("nx").disabled=page>=pages-1}
$("pv").onclick=()=>{page--;draw();scrollTo(0,0)};$("nx").onclick=()=>{page++;draw();scrollTo(0,0)};$("ps").onchange=draw;
let t;$("q").oninput=()=>{clearTimeout(t);t=setTimeout(run,120)};$("fs").onchange=run;$("fg").onchange=run;
fetch("songs.json").then(r=>r.json()).then(j=>{D=j;D.forEach(r=>r._h=C.map(([k])=>r[k]||"").join(" ").toLowerCase());
const opt=(id,k)=>{const m={};D.forEach(r=>{if(r[k])m[r[k]]=(m[r[k]]||0)+1});$(id).innerHTML+=Object.keys(m).sort(col.compare).map(v=>`<option value="${esc(v)}">${esc(v)} (${m[v]})</option>`).join("")};
opt("fs","source_folder");opt("fg","genre");run()});
</script></body></html>
